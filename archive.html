<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ACE3D9">
  <title>About — Brand Book</title>
  <script>try{var pt=sessionStorage.getItem('pt');if(pt){document.documentElement.classList.add('pt-in');if(pt==='dark')document.documentElement.classList.add('pt-dark')}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="archive" class="is-book">

  <header class="bar" id="bar">
    <a class="bar__logo" href="index.html" aria-label="Home"><img src="m_logo.png" alt="M" onerror="this.outerHTML='<span>M</span>'"></a>
    <!-- 메뉴 글자는 고유 폰트 이미지 (색은 로고와 항상 같음, 이미지가 없으면 글자로 표시) -->
    <a class="u bar__word" href="info.html" aria-label="3D Product"><img src="Pouch.png" alt="Pouch" onerror="this.outerHTML='Pouch'"></a>
    <a class="u bar__word bar__word--desc" href="selected.html" aria-label="Story"><img src="Story.png" alt="Story" onerror="this.outerHTML='Story'"></a>
    <a class="u bar__word" href="archive.html" aria-label="About"><img src="About.png" alt="About" onerror="this.outerHTML='About'"></a>
  </header>

  <main class="book">
    <div class="book-meta">
      <span class="k">(About)</span>
      <span class="k">(MADEUP Brand Book)</span>
    </div>

    <!-- 책이 들어가는 자리 (StPageFlip) -->
    <div class="book-stage" id="book-stage"><div class="book-flip" id="book-flip"></div></div>

    <span class="book-load num" id="book-load">Loading 0%</span>

    <!-- 넘기기 : 화면 양옆의 < > -->
    <button class="design-arrow design-arrow--prev" id="book-prev" type="button" aria-label="Previous page">
      <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M18 4 L6 24 L18 44"/></svg>
    </button>
    <button class="design-arrow design-arrow--next" id="book-next" type="button" aria-label="Next page">
      <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M6 4 L18 24 L6 44"/></svg>
    </button>

    <span class="book-hint" data-t="about.hint">Drag, Scroll, Tap</span>
    <span class="book-page num" id="book-page">Cover</span>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
  <!-- 책 넘김 라이브러리 : StPageFlip (https://nodlik.github.io/StPageFlip/) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
  /* =========================================================
     브랜드북 — book 폴더의 page-01.jpg ~ page-20.jpg 를 종이처럼 넘김
     · 01 = 앞표지, 02 = 앞표지 안쪽(빈 면), 03~18 = 내지 1~16쪽, 19 = 뒤표지 안쪽(빈 면), 20 = 뒤표지
     · 페이지를 바꾸려면 book 폴더 이미지만 같은 이름으로 바꾸면 됨 (가로 1600px 권장)
     · 파일을 더블클릭(file://)으로 열 때는 book/book-data.js 를 대신 읽음
     · 표지·내지 모두 같은 얇은 종이로 넘어감
     · 모서리를 잡고 끌거나, 페이지를 탭/클릭하거나, 휠·← → 키·양옆 < > 로 넘김
     ========================================================= */
  (function () {
    const BOOK = {
      pages: 20,                 // 전체 면 수 (짝수, 1 = 앞표지, 마지막 = 뒤표지)
      inner: 16,                 // 내지 쪽 수 (쪽 번호 표시용)
      w: 1600, h: 1181,          // 한 면의 비율 (가로, 세로)
      file: (n) => 'book/page-' + String(n).padStart(2, '0') + '.jpg',
      turn: 900,                 // 한 장 넘기는 시간(ms)
      shadow: 0.4,               // 넘길 때 휘는 종이 음영 진하기 (0 ~ 1)
      shade: '150, 104, 48',     // 휘는 종이 음영 색 (R, G, B) — 미색 종이처럼 따뜻한 갈색
      portraitBelow: 640,        // 화면 너비가 이보다 좁으면 한 면씩 보기
    };

    const flipEl = document.getElementById('book-flip');
    const stageEl = document.getElementById('book-stage');
    const loadEl = document.getElementById('book-load');
    const pageEl = document.getElementById('book-page');
    const L = BOOK.pages;

    function loadScript(src) {
      return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    }

    let loadHidden = false;
    function hideLoad() {
      if (loadHidden) return; loadHidden = true;
      loadEl.style.transition = 'opacity .5s'; loadEl.style.opacity = '0';
      setTimeout(() => (loadEl.style.display = 'none'), 500);
    }

    async function sources() {
      if (location.protocol === 'file:') {
        try { await loadScript('book/book-data.js'); return (n) => window.BOOK_DATA[n - 1]; }
        catch (e) { console.warn('book/book-data.js 를 찾지 못했습니다'); }
      }
      return BOOK.file;
    }

    function label(pf) {
      const i = pf.getCurrentPageIndex();
      const portrait = pf.getOrientation() === 'portrait';
      if (i === 0) return 'Cover';
      if (i >= L - 1) return 'Back cover';
      const faces = portrait ? [i + 1] : [i + 1, i + 2];          // 1부터 센 면 번호
      const nums = faces.map((f) => f - 2).filter((n) => n >= 1 && n <= BOOK.inner);
      if (!nums.length) return portrait ? (i === 1 ? 'Cover' : 'Back cover') : '';
      const p = (n) => String(n).padStart(2, '0');
      return nums.map(p).join('–') + ' / ' + p(BOOK.inner);
    }

    (async function init() {
      if (!window.St || !St.PageFlip) { loadEl.textContent = 'Could not load the book'; return; }
      const src = await sources();

      // 면 만들기
      let done = 0;
      for (let n = 1; n <= L; n++) {
        const pg = document.createElement('div');
        pg.className = 'book-sheet' + (n % 2 ? ' is-right' : ' is-left');
        const img = new Image();
        img.alt = n === 1 ? 'MADEUP Brand Book' : '';
        img.decoding = 'async';
        img.draggable = false;
        const tick = () => { done++; loadEl.textContent = 'Loading ' + Math.round(done / L * 100) + '%'; if (done >= Math.min(4, L)) hideLoad(); };
        img.onload = tick; img.onerror = tick;
        img.src = src(n);
        pg.appendChild(img);
        flipEl.appendChild(pg);
      }

      const pf = new St.PageFlip(flipEl, {
        width: BOOK.w, height: BOOK.h,
        size: 'stretch',
        minWidth: 120, maxWidth: 2400, minHeight: 90, maxHeight: 1800,
        autoSize: false,
        showCover: true,
        usePortrait: true,
        drawShadow: true,
        maxShadowOpacity: BOOK.shadow,
        flippingTime: BOOK.turn,
        showPageCorners: true,
        mobileScrollSupport: false,
        swipeDistance: 20,
        startZIndex: 1,
      });
      pf.loadFromHTML(flipEl.querySelectorAll('.book-sheet'));
      // showCover 를 켜면 라이브러리가 앞·뒤표지를 빳빳하게(hard) 바꾸므로, 모든 면을 다시 얇은 종이(soft)로
      for (let i = 0; i < pf.getPageCount(); i++) pf.getPage(i).setDensity('soft');
      // 넘길 때 생기는 음영 : 검정 대신 따뜻한 종이색, 반짝이는 띠 없이 부드럽게 (무광 종이 느낌)
      const C = BOOK.shade;
      function matte(el, inner) {
        new MutationObserver(() => {
          const s = el.getAttribute('style') || '';
          const m = s.match(/background: linear-gradient\((to \w+), rgba\(0, 0, 0, ([\d.]+)\)[^;]*;/);
          if (!m) return;
          const a = +m[2];
          const g = inner
            ? `linear-gradient(${m[1]}, rgba(${C}, ${(a * 0.55).toFixed(3)}) 0%, rgba(${C}, ${(a * 0.22).toFixed(3)}) 45%, rgba(${C}, 0) 100%)`
            : `linear-gradient(${m[1]}, rgba(${C}, ${(a * 0.6).toFixed(3)}), rgba(${C}, 0))`;
          el.setAttribute('style', s.replace(m[0], 'background: ' + g + ';'));
        }).observe(el, { attributes: true, attributeFilter: ['style'] });
      }
      flipEl.querySelectorAll('.stf__innerShadow').forEach((el) => matte(el, true));
      flipEl.querySelectorAll('.stf__outerShadow').forEach((el) => matte(el, false));

      // 화면 크기에 맞춰 한 면 / 펼친 면 결정
      function fit() {
        const r = stageEl.getBoundingClientRect();
        const portrait = innerWidth < BOOK.portraitBelow;
        const per = portrait ? 1 : 2;
        let pw = r.width / per, ph = pw * BOOK.h / BOOK.w;
        if (ph > r.height) { ph = r.height; pw = ph * BOOK.w / BOOK.h; }
        flipEl.style.width = Math.floor(pw * per) + 'px';
        flipEl.style.height = Math.floor(ph) + 'px';
        pf.getSettings().minWidth = portrait ? pw * 2 : 1;  // 좁은 화면은 한 면 보기
        pf.update();
        pageEl.textContent = label(pf);
      }
      addEventListener('resize', fit); fit();

      pf.on('flip', () => (pageEl.textContent = label(pf)));
      pf.on('changeOrientation', () => (pageEl.textContent = label(pf)));
      pageEl.textContent = label(pf);

      // 화살표 · 키보드 · 휠
      const next = () => pf.flipNext('bottom');
      const prev = () => pf.flipPrev('bottom');
      [['book-prev', prev], ['book-next', next]].forEach(([id, fn]) => {
        const b = document.getElementById(id);
        b.addEventListener('pointerdown', (e) => e.stopPropagation());
        b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
      });
      addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev(); });
      let wheelLock = 0;
      addEventListener('wheel', (e) => {
        const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        if (Math.abs(d) < 8) return;
        const now = performance.now();
        if (now < wheelLock) { wheelLock = now + 220; return; }  // 한 번의 휠 동작 = 한 장
        wheelLock = now + BOOK.turn * 0.6;
        d > 0 ? next() : prev();
      }, { passive: true });
    })();
  })();
  </script>
</body>
</html>
