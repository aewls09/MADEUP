<!doctype html>
<html lang="ko" class="no-scroll">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ACE3D9">
  <title>Home</title>
  <script>try{var pt=sessionStorage.getItem('pt');if(pt){document.documentElement.classList.add('pt-in');if(pt==='dark')document.documentElement.classList.add('pt-dark')}}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">

  <!-- 상단 바: 메인에서는 영상 한가운데에 고정. 메뉴를 누르면 위로 올라가며 다음 페이지로 -->
  <header class="bar is-light" id="bar">
    <a class="bar__logo" href="index.html" aria-label="Home"><img src="m_logo.png" alt="M" onerror="this.outerHTML='<span>M</span>'"></a>
    <!-- 메뉴 글자는 고유 폰트 이미지 (이미지가 없으면 글자로 표시) -->
    <a class="u bar__word" href="info.html" aria-label="3D Product"><img src="Pouch.png" alt="Pouch" onerror="this.outerHTML='Pouch'"></a>
    <a class="u bar__word bar__word--desc" href="selected.html" aria-label="Story"><img src="Story.png" alt="Story" onerror="this.outerHTML='Story'"></a>
    <a class="u bar__word" href="archive.html" aria-label="About"><img src="About.png" alt="About" onerror="this.outerHTML='About'"></a>
  </header>

  <main>
    <!-- 메인은 스크롤 없는 한 화면 : 전체 화면 영상 + 가운데 메뉴 + 아래 한 줄 -->
    <section class="hero">
      <div class="hero__media">
        <video src="background.mp4" autoplay muted loop playsinline preload="auto"
               disablepictureinpicture disableremoteplayback data-fallback="background.mp4"></video>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
  <script>
    (function () {
      // 스크롤 없음 : 휠·터치 스크롤을 멈추고, 메뉴는 화면 세로 가운데에 둠
      SITE.lenis && SITE.lenis.stop();
      const bar = SITE.bar;
      const place = () => gsap.set(bar, { y: innerHeight / 2 - bar.offsetHeight / 2 });
      place();
      addEventListener('resize', place);

      /* ---------- 배경 영상 소리 ----------
         · 브라우저가 허락하면(이 사이트를 이미 클릭한 적 있는 경우 등) 들어오자마자 소리가 남
         · 허락하지 않으면 소리 없이 재생하다가, 첫 클릭·터치·키 입력 때 소리가 부드럽게 켜짐
         · 오른쪽 아래 Sound On / Sound Off 로 직접 켜고 끔 (끈 상태는 다시 와도 유지) */
      const v = document.querySelector('.hero__media video');

      /* ---------- 영상 밖 여백 색을 영상 가장자리 색에 실시간으로 맞춤 ----------
         영상(3:2)과 화면 비율이 달라 생기는 여백이 영상 배경(베이지 → 민트)과 이어져 보이게 함.
         작은 크기로 줄인 화면의 오른쪽 끝·위·아래 줄만 0.25초마다 읽음 (가벼움) */
      if (v) {
        const media = v.parentElement;
        const cv = document.createElement('canvas'); cv.width = 48; cv.height = 32;
        const cx = cv.getContext('2d', { willReadFrequently: true });
        const med = (arr) => { arr.sort((a, b) => a - b); return arr[arr.length >> 1]; };
        const sampleEdge = () => {
          if (v.readyState < 2 || document.hidden) return;
          try {
            cx.drawImage(v, 0, 0, 48, 32);
            const d = cx.getImageData(0, 0, 48, 32).data, R = [], G = [], B = [];
            const take = (x, y) => { const i = (y * 48 + x) * 4; R.push(d[i]); G.push(d[i + 1]); B.push(d[i + 2]); };
            for (let y = 0; y < 32; y++) take(47, y);                                  // 오른쪽 끝
            for (let x = 16; x < 48; x++) { take(x, 0); take(x, 31); }                // 위·아래 (오른쪽 2/3)
            media.style.backgroundColor = 'rgb(' + med(R) + ',' + med(G) + ',' + med(B) + ')';
          } catch (e) { clearInterval(timer); }   // html 을 파일로 바로 연 경우 등 : 기본 색 유지
        };
        const timer = setInterval(sampleEdge, 250);
        v.addEventListener('loadeddata', sampleEdge);
      }
      // 메뉴를 영상 가로 폭 안에 맞추기 위해 영상 비율(가로/세로)을 CSS 에 알려 줌
      if (v) {
        const setRatio = () => v.videoWidth && document.body.style.setProperty('--vr', (v.videoWidth / v.videoHeight).toFixed(4));
        v.addEventListener('loadedmetadata', setRatio); setRatio();
      }
      const btn = document.getElementById('sound');   // 소리 버튼은 화면에서 뺌 (없어도 첫 클릭에 소리가 켜짐)
      if (!v) return;
      const store = { get: () => { try { return sessionStorage.getItem('sound'); } catch (e) { return null; } },
                      set: (x) => { try { sessionStorage.setItem('sound', x); } catch (e) {} } };
      const ui = (on) => { if (!btn) return; btn.textContent = on ? 'Sound Off' : 'Sound On'; btn.setAttribute('aria-pressed', on); };
      const fade = (to, d, done) => gsap.to(v, { volume: to, duration: d, ease: 'power1.inOut', overwrite: true, onComplete: done });

      // 소리가 막힌 경우 : 바로 소리를 끄고 영상은 계속 재생, 첫 클릭·터치 때 다시 시도
      function blocked() {
        v.muted = true; v.play().catch(() => {}); ui(false); armFirstTouch();
      }
      // 크롬은 먼저 '재생됨'이라고 답한 뒤 잠시 후 소리 때문에 영상을 멈추기도 함
      // → 소리를 켠 뒤 2.5초 안에 영상이 멈추면 '막힘'으로 보고 위처럼 처리
      let tryAt = 0;
      v.addEventListener('pause', () => {
        if (!v.muted && performance.now() - tryAt < 2500) blocked();
      });
      function soundOn() {
        tryAt = performance.now();
        v.muted = false;
        v.volume = 0;
        const p = v.play();
        (p && p.then ? p : Promise.resolve())
          .then(() => { if (!v.muted && !v.paused) { fade(1, 1.5); ui(true); } })
          .catch(blocked);
      }
      function soundOff() { fade(0, 0.5, () => { v.muted = true; }); ui(false); }

      // 첫 사용자 동작에 소리 켜기 (소리 버튼 자체를 누른 경우는 버튼이 처리)
      let armed = false;
      const evs = ['pointerdown', 'keydown', 'touchend'];
      function onFirst(e) {
        if (e.target.closest && e.target.closest('#sound')) return;
        evs.forEach((n) => removeEventListener(n, onFirst, true));
        armed = false;
        if (store.get() !== 'off') soundOn();
      }
      function armFirstTouch() {
        if (armed) return; armed = true;
        evs.forEach((n) => addEventListener(n, onFirst, true));
      }

      btn && btn.addEventListener('click', () => {
        if (v.muted || v.paused) { store.set('on'); soundOn(); }
        else { store.set('off'); soundOff(); }
      });

      // 다른 페이지로 넘어갈 때 소리를 조용히 줄임
      document.addEventListener('click', (e) => {
        const a = e.target.closest('a[href$=".html"]');
        if (a && !v.muted) fade(0, 0.6);
      });

      ui(false);
      if (store.get() !== 'off') soundOn();   // 바로 소리 내기 시도 → 막히면 첫 클릭을 기다림
    })();
  </script>
</body>
</html>
